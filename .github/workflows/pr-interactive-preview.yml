name: Downloadable PR interactive preview

on:
  pull_request:
    paths:
      - 'css/**'
      - 'js/**'
      - 'index.template.html'
      - 'build.py'
      - '.github/workflows/pr-interactive-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Package browser-ready preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static app (real source, no placeholders)
        run: python build.py
      - name: Add local-preview instructions
        run: |
          cat > dist/PREVIEW-README.txt <<'EOF'
          DaevaArchitect: INTERACTIVE REVIEW BEFORE MERGE

          1. Extract the GitHub Actions artifact ZIP.
          2. Open a terminal in the extracted folder containing index.html.
          3. Run: python -m http.server 8000
          4. Visit http://localhost:8000 in your browser.

          This is the real unmerged PR code, not a mockup.
          No publishing or GitHub Pages deployment is required.
          Use a separate browser profile if you want an empty character
          save store; your normal live-site saved builds are not changed.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: DaevaArchitect-unmerged-interactive-preview
          path: dist/
          retention-days: 14
          if-no-files-found: error
