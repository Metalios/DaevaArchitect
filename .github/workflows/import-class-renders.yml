name: Import transparent AION 2 class renders

on:
  push:
    branches: [feature/transparent-official-class-renders]
    paths:
      - scripts/import_official_class_art.py
      - .github/workflows/import-class-renders.yml

permissions:
  contents: write

jobs:
  import-class-art:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation and encoding
        run: python -m pip install Pillow==11.3.0
      - name: Download, validate and optimize eight class layers
        run: python scripts/import_official_class_art.py
      - name: Commit self-hosted transparent character renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/class-renders/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Bundle all eight transparent AION 2 promotional class renders"
            git push
          fi
