name: Validate Daeva Architect v2
on:
  push:
    branches: [v2, fix/v2-readability-icons]
  workflow_dispatch:
concurrency:
  group: v2-ui-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Wikily icon sources
        run: python scripts/probe_wikily.py
      - name: Import original AION 2 icon assets
        run: python scripts/sync_wikily_icons.py --strict
      - name: Build static site
        run: python build.py
      - name: Verify game-data invariants
        run: |
          node verify.mjs
          node verify_icons.mjs
          node audit_leveling.mjs
          node v2_allocations.mjs
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Exercise v2 interface at three resolutions
        run: |
          node leveling_macro_smoke.mjs
          node v2_smoke.mjs
      - name: Save compiled v2 preview for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daeva-v2-build-preview
          path: dist/
          if-no-files-found: error
      - name: Save source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikily-markup-audit
          path: wikily_probe/
          if-no-files-found: ignore
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daeva-v2-workspace-previews
          path: v2-previews/*.png
          if-no-files-found: ignore
