name: Review mock fidelity and recommendations
on:
  push:
    branches: [ui-fidelity-recommendations]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build planner
        run: python build.py
      - name: Audit game rules, class advice, and point budgets
        run: |
          node verify.mjs
          node audit_leveling.mjs
          node recommendations_audit.mjs
          node leveling_rotation_audit.mjs
      - name: Set up Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Browser checks and previews
        run: |
          node leveling_macro_smoke.mjs
          node mastery_board_gear_smoke.mjs
          node board_macro_usability_smoke.mjs
          node v2_smoke.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-fidelity-screenshots
          path: v2-previews/*.png
          if-no-files-found: ignore
      - name: Upload tested site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mock-fidelity-preview
          path: dist/
          if-no-files-found: error
