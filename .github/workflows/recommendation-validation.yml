name: Validate progression recommendations
on:
  push:
    branches: [feature/research-grounded-progression]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated script syntax
        run: |
          for file in js/*.js js/engine/*.js; do node --check "$file"; done
          node --check budget_exhaustion_regression.mjs
          node --check budget_exhaustion_smoke.mjs
      - name: Audit progression model
        run: |
          node amplification_regression.mjs
          node budget_exhaustion_regression.mjs
          node arcana_ariel_regression.mjs
          node arcana_gear_templar_pvp_regression.mjs
          node global_action_evidence_audit.mjs
          node timeline_engine_regression.mjs
          node animation_evidence_regression.mjs
          node joint_progression_regression.mjs
          node cooldown_rules_regression.mjs
          node combat_evidence_regression.mjs
          node global_cohort_regression.mjs
          node matched_calibration_regression.mjs
          node combat_engine_regression.mjs
          node sorcerer_full_path_regression.mjs
          node sorcerer_nightmare_regression.mjs
          node sorcerer_mobile_damage_regression.mjs
          node sorcerer_two_button_flow_regression.mjs
          node sorcerer_wish_priority_regression.mjs
          node sorcerer_manual_hotbar_regression.mjs
          node sorcerer_macro_audit.mjs
          node verify_icons.mjs
          node recommendation_regression.mjs
          node class_role_regression.mjs
          node pvp_context_regression.mjs
          node pvp_matchup_regression.mjs
          node templar_pvp_joint_regression.mjs
          node leveling_rotation_audit.mjs
          node ranger_rotation_regression.mjs
          node recommendations_audit.mjs
          node audit_leveling.mjs
          node verify.mjs
      - name: Build site
        run: python build.py
      - name: Browser smoke checks
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          node budget_exhaustion_smoke.mjs
          node combat_optimizer_smoke.mjs
          node leveling_macro_smoke.mjs
          node recommendation_coherence_smoke.mjs
          node templar_pvp_burst_smoke.mjs
          node goal_route_smoke.mjs
          node mastery_board_gear_smoke.mjs
          node board_macro_usability_smoke.mjs
          node character_resources_board_smoke.mjs
          node class_art_smoke.mjs
          node customization_smoke.mjs
          node board_crystal_cycle_smoke.mjs
          node board_recalculation_feedback_smoke.mjs
          node gear_swap_board_recalculate_smoke.mjs
          node v2_smoke.mjs
          node joint_progression_smoke.mjs
          node class_role_smoke.mjs
          node sorcerer_nightmare_smoke.mjs
          node global_cohort_smoke.mjs
          node fresh45_stigma_smoke.mjs
